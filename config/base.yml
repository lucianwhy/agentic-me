# ChatCV 核心配置
llm:
  provider: "openai"          # openai（含 DeepSeek 等兼容接口）或 ollama
  model: "gpt-4o-mini"        # 也可用 deepseek-chat / qwen-plus 等
  temperature: 0.1
  timeout: 180
  reasoning_effort: "none"  # none|low|medium|high|xhigh|max；中档偏快
  base_url: null              # 也可通过 OPENAI_BASE_URL / LLM_BASE_URL 覆盖

ollama:
  endpoint: "http://localhost:11434"
  models: "llama3.2"
  timeout: 120

embedding:
  # fastembed | openai | ollama | ark (volcengine/doubao multimodal)
  provider: "fastembed"
  model: "BAAI/bge-small-zh-v1.5"
  # Ark 示例：provider=ark, model=<endpoint id ep-...>, base_url=https://ark.cn-beijing.volces.com/api/v3
  chunk_size: 1000
  chunk_overlap: 200
  base_url: null

vectorstore:
  provider: "chroma"
  persist_directory: "data/vector_db"
  collection_name: "chatcv"
  retrieval_k: 4

rate_limit:
  enabled: true
  requests_per_minute: 20
  burst_limit: 5
  rate_limit_ms: 3000

security:
  session_timeout_hours: 24
  max_query_length: 1000
  max_job_text_length: 5000
  min_job_text_length: 50
  allowed_origins: ["*"]
  secure_cookies: true

logging:
  level: "INFO"
  file_path: "logs/chatcv.log"
  max_file_size_mb: 100
  backup_count: 5
  analytics_enabled: true

data:
  cv_path: "data/CV_王皓月.pdf"
  about_me_path: "data/about_me.md"
  vector_db_path: "data/vector_db"
  analytics_log_path: "data/analytics.log"

