<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>agentic-me · 管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
    <main class="mx-auto max-w-2xl px-4 py-12">
        <section class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
            <p class="text-sm font-medium text-slate-500">agentic-me</p>
            <h1 class="mt-1 text-2xl font-bold">运行配置</h1>
            <p class="mt-2 text-sm leading-6 text-slate-600">配置保存在服务器的 <code>.env</code>。密钥不会在此页面回显。</p>

            <form id="login-form" class="mt-6 space-y-4">
                <label class="block">
                    <span class="text-sm font-medium">管理密码</span>
                    <span class="relative mt-1 block">
                        <input id="password" type="password" autocomplete="current-password" required
                               class="w-full rounded-lg border border-slate-300 px-3 py-2 pr-16 focus:border-slate-500 focus:outline-none"
                               placeholder="输入管理密码">
                        <button id="password-toggle" type="button"
                                class="absolute inset-y-0 right-0 flex items-center gap-1 px-3 text-sm text-slate-500 hover:text-slate-900"
                                aria-label="显示密码" aria-pressed="false">
                            <svg aria-hidden="true" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path>
                                <circle cx="12" cy="12" r="2.5"></circle>
                            </svg>
                            <span id="password-toggle-text">显示</span>
                        </button>
                    </span>
                </label>
                <button class="rounded-lg bg-slate-800 px-4 py-2 font-semibold text-white hover:bg-slate-700" type="submit">进入管理页</button>
                <p id="login-status" class="text-sm" role="alert"></p>
            </form>

            <form id="settings-form" class="mt-6 hidden space-y-5">
                <div class="flex items-center justify-between gap-3 border-b border-slate-200 pb-4">
                    <div>
                        <h2 class="font-semibold">对话模型</h2>
                        <p class="mt-1 text-sm text-slate-500">保存后，新请求会立即使用新的设置。</p>
                    </div>
                    <button id="logout" class="text-sm text-slate-600 underline hover:text-slate-900" type="button">退出</button>
                </div>

                <label class="block">
                    <span class="text-sm font-medium">OpenAI 兼容 API Key</span>
                    <input id="api-key" type="password" autocomplete="new-password"
                           class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-slate-500 focus:outline-none"
                           placeholder="留空则保留当前 Key">
                    <span id="key-status" class="mt-1 block text-xs text-slate-500"></span>
                </label>

                <label class="block">
                    <span class="text-sm font-medium">API 地址（可选）</span>
                    <input id="base-url" type="url"
                           class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-slate-500 focus:outline-none"
                           placeholder="https://api.openai.com/v1">
                    <span class="mt-1 block text-xs text-slate-500">DeepSeek、OpenAI 网关等兼容接口填写完整 URL；留空使用服务商默认地址。</span>
                </label>

                <label class="block">
                    <span class="text-sm font-medium">默认回答分析强度</span>
                    <select id="reasoning-effort" class="mt-1 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 focus:border-slate-500 focus:outline-none"></select>
                    <span class="mt-1 block text-xs text-slate-500">强度越高，复杂问题通常更细致，但响应会更慢、成本也可能更高。下方模型列表可为单个模型单独设置。</span>
                </label>

                <div class="flex items-center gap-3">
                    <button id="save" class="rounded-lg bg-emerald-700 px-4 py-2 font-semibold text-white hover:bg-emerald-800 disabled:opacity-50" type="submit">保存并应用</button>
                    <p id="save-status" class="text-sm" role="status"></p>
                </div>
            </form>

            <section id="models-section" class="mt-8 hidden border-t border-slate-200 pt-6">
                <div>
                    <h2 class="font-semibold">模型列表</h2>
                    <p class="mt-1 text-sm text-slate-500">前台「模型」切换器显示的选项，修改后立即生效（无需重启）。不在列表中的模型请求会自动使用默认模型。</p>
                </div>

                <ul id="model-list" class="mt-4 divide-y divide-slate-200 rounded-xl border border-slate-200"></ul>
                <p id="models-status" class="mt-2 min-h-5 text-sm" role="status"></p>

                <form id="add-model-form" class="mt-4 rounded-xl border border-dashed border-slate-300 p-4">
                    <h3 class="text-sm font-semibold">添加模型</h3>
                    <div class="mt-3 grid gap-3 sm:grid-cols-[1.4fr_1fr_0.9fr]">
                        <label class="block">
                            <span class="text-xs font-medium text-slate-600">模型 ID</span>
                            <input id="new-model-id" required maxlength="128"
                                   class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-slate-500 focus:outline-none"
                                   placeholder="例如 gpt-5.6-luna">
                        </label>
                        <label class="block">
                            <span class="text-xs font-medium text-slate-600">显示名称</span>
                            <input id="new-model-label" maxlength="40"
                                   class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-slate-500 focus:outline-none"
                                   placeholder="留空则显示 ID">
                        </label>
                        <label class="block">
                            <span class="text-xs font-medium text-slate-600">分析强度（可选）</span>
                            <select id="new-model-effort" class="mt-1 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm focus:border-slate-500 focus:outline-none"></select>
                        </label>
                    </div>
                    <button id="add-model" class="mt-3 rounded-lg bg-slate-800 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-700 disabled:opacity-50" type="submit">添加</button>
                </form>
            </section>
        </section>
    </main>

    <script>
        const loginForm = document.getElementById('login-form');
        const settingsForm = document.getElementById('settings-form');
        const loginStatus = document.getElementById('login-status');
        const saveStatus = document.getElementById('save-status');
        const effortSelect = document.getElementById('reasoning-effort');
        const passwordInput = document.getElementById('password');
        const passwordToggle = document.getElementById('password-toggle');
        const passwordToggleText = document.getElementById('password-toggle-text');

        async function request(url, options = {}) {
            const response = await fetch(url, { credentials: 'include', ...options });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.detail || '请求失败，请稍后重试。');
            return data;
        }

        function showSettings(data) {
            document.getElementById('base-url').value = data.base_url || '';
            document.getElementById('key-status').textContent = data.api_key_configured ? '当前已配置 API Key；留空不会覆盖。' : '当前尚未配置 API Key。';
            effortSelect.innerHTML = '';
            (data.reasoning_efforts || []).forEach((effort) => {
                const option = document.createElement('option');
                option.value = effort;
                option.textContent = effort;
                option.selected = effort === data.reasoning_effort;
                effortSelect.appendChild(option);
            });
            loginForm.classList.add('hidden');
            settingsForm.classList.remove('hidden');
            modelsSection.classList.remove('hidden');
        }

        async function loadSettings() {
            const data = await request('/api/admin/settings');
            showSettings(data);
            renderModels(await request('/api/admin/models'));
        }

        // ---- 模型列表 ----
        const modelsSection = document.getElementById('models-section');
        const modelList = document.getElementById('model-list');
        const modelsStatus = document.getElementById('models-status');
        const newEffort = document.getElementById('new-model-effort');
        let modelState = { default: '', models: [], reasoning_efforts: [] };

        function setModelsStatus(text, tone = 'muted') {
            modelsStatus.textContent = text;
            modelsStatus.className = 'mt-2 min-h-5 text-sm ' + ({ ok: 'text-emerald-700', error: 'text-red-700' }[tone] || 'text-slate-500');
        }

        function effortOptions(select, selected) {
            select.innerHTML = '';
            [['', '跟随默认'], ...modelState.reasoning_efforts.map((e) => [e, e])].forEach(([value, text]) => {
                const option = document.createElement('option');
                option.value = value;
                option.textContent = text;
                option.selected = value === (selected || '');
                select.appendChild(option);
            });
        }

        function button(text, title, onClick, extra = '') {
            const b = document.createElement('button');
            b.type = 'button';
            b.textContent = text;
            b.title = title;
            b.setAttribute('aria-label', title);
            b.className = 'rounded-md px-2 py-1 text-xs text-slate-600 hover:bg-slate-100 hover:text-slate-900 disabled:pointer-events-none disabled:opacity-30 ' + extra;
            b.addEventListener('click', onClick);
            return b;
        }

        function renderModels(data) {
            modelState = data;
            effortOptions(newEffort, '');
            modelList.innerHTML = '';
            data.models.forEach((m, index) => {
                const isDefault = m.id === data.default;
                const li = document.createElement('li');
                li.className = 'flex flex-wrap items-center gap-2 px-3 py-2.5';
                li.dataset.modelId = m.id;

                const info = document.createElement('div');
                info.className = 'min-w-0 flex-1';
                const label = document.createElement('div');
                label.className = 'flex items-center gap-2 text-sm font-medium';
                label.textContent = m.label;
                if (isDefault) {
                    const badge = document.createElement('span');
                    badge.className = 'rounded-full bg-emerald-50 px-2 py-0.5 text-xs font-medium text-emerald-700 ring-1 ring-emerald-200';
                    badge.textContent = '默认';
                    label.appendChild(badge);
                }
                const id = document.createElement('div');
                id.className = 'truncate font-mono text-xs text-slate-500';
                id.textContent = m.id + (m.reasoning_effort ? ' · 强度 ' + m.reasoning_effort : '');
                info.append(label, id);

                const actions = document.createElement('div');
                actions.className = 'flex items-center gap-0.5';
                const up = button('↑', '上移', () => move(index, -1));
                up.disabled = index === 0;
                const down = button('↓', '下移', () => move(index, 1));
                down.disabled = index === data.models.length - 1;
                const def = button('设为默认', '设为默认模型', () => mutate('/api/admin/models/default', 'POST', { id: m.id }, '已设为默认：' + m.label));
                def.disabled = isDefault;
                const del = button('删除', isDefault ? '默认模型不能删除' : '删除此模型', () => {
                    if (confirm('从前台切换器中删除「' + m.label + '」？')) {
                        mutate('/api/admin/models/' + encodeURIComponent(m.id), 'DELETE', null, '已删除：' + m.label);
                    }
                }, 'hover:!bg-red-50 hover:!text-red-700');
                del.disabled = isDefault;
                actions.append(up, down, def, del);
                li.append(info, actions);
                modelList.appendChild(li);
            });
        }

        async function mutate(url, method, body, okText) {
            setModelsStatus('正在保存…');
            try {
                const data = await request(url, {
                    method,
                    headers: body ? { 'Content-Type': 'application/json' } : undefined,
                    body: body ? JSON.stringify(body) : undefined
                });
                renderModels(data);
                setModelsStatus(okText, 'ok');
                return true;
            } catch (error) {
                setModelsStatus(error.message, 'error');
                return false;
            }
        }

        function move(index, delta) {
            const ids = modelState.models.map((m) => m.id);
            const [item] = ids.splice(index, 1);
            ids.splice(index + delta, 0, item);
            mutate('/api/admin/models/order', 'POST', { ids }, '顺序已更新');
        }

        document.getElementById('add-model-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            const idInput = document.getElementById('new-model-id');
            const labelInput = document.getElementById('new-model-label');
            const addButton = document.getElementById('add-model');
            addButton.disabled = true;
            const ok = await mutate('/api/admin/models', 'POST', {
                id: idInput.value.trim(),
                label: labelInput.value.trim() || null,
                reasoning_effort: newEffort.value || null
            }, '已添加：' + (labelInput.value.trim() || idInput.value.trim()));
            if (ok) { idInput.value = ''; labelInput.value = ''; newEffort.value = ''; }
            addButton.disabled = false;
        });

        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            loginStatus.textContent = '正在验证…';
            loginStatus.className = 'text-sm text-slate-500';
            try {
                await request('/api/admin/session', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: document.getElementById('password').value })
                });
                document.getElementById('password').value = '';
                await loadSettings();
            } catch (error) {
                loginStatus.textContent = error.message;
                loginStatus.className = 'text-sm text-red-700';
            }
        });

        passwordToggle.addEventListener('click', () => {
            const shouldReveal = passwordInput.type === 'password';
            passwordInput.type = shouldReveal ? 'text' : 'password';
            passwordToggle.setAttribute('aria-label', shouldReveal ? '隐藏密码' : '显示密码');
            passwordToggle.setAttribute('aria-pressed', String(shouldReveal));
            passwordToggleText.textContent = shouldReveal ? '隐藏' : '显示';
            passwordInput.focus();
        });

        settingsForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const saveButton = document.getElementById('save');
            const apiKey = document.getElementById('api-key').value.trim();
            const payload = {
                base_url: document.getElementById('base-url').value.trim(),
                reasoning_effort: effortSelect.value
            };
            if (apiKey) payload.api_key = apiKey;
            saveButton.disabled = true;
            saveStatus.textContent = '正在保存…';
            saveStatus.className = 'text-sm text-slate-500';
            try {
                const data = await request('/api/admin/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                document.getElementById('api-key').value = '';
                showSettings(data);
                saveStatus.textContent = '已保存并应用到后续请求。';
                saveStatus.className = 'text-sm text-emerald-700';
            } catch (error) {
                saveStatus.textContent = error.message;
                saveStatus.className = 'text-sm text-red-700';
            } finally {
                saveButton.disabled = false;
            }
        });

        document.getElementById('logout').addEventListener('click', async () => {
            await request('/api/admin/session', { method: 'DELETE' });
            settingsForm.classList.add('hidden');
            modelsSection.classList.add('hidden');
            loginForm.classList.remove('hidden');
            loginStatus.textContent = '';
        });

        loadSettings().catch(() => {});
    </script>
</body>
</html>
